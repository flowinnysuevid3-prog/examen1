<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Validador</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-card{ background:#fff; border:1px solid var(--border); border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 4px 24px rgba(20,30,25,.08); }
.auth-logo{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--emerald-dark); margin-bottom:6px; text-align:center; }
.auth-sub{ text-align:center; color:var(--text-2); font-size:13.5px; margin-bottom:28px; }
.auth-field{ margin-bottom:18px; }
.auth-field label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:6px; }
.auth-field input{ width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14.5px; font-family:'JetBrains Mono',monospace; background:#FAFBF9; color:var(--text); }
.auth-field input:focus{ outline:2px solid var(--emerald); outline-offset:1px; border-color:transparent; }
.auth-hint{ font-size:11.5px; color:var(--text-3); margin-top:5px; }
.auth-error{ background:var(--red-light); border:1px solid #F0C3C3; color:#7A2529; border-radius:10px; padding:11px 14px; font-size:13px; margin-bottom:16px; }
.auth-link-row{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-2); }
.auth-link-row a{ color:var(--emerald-dark); font-weight:600; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">📄 Validador</div>
  <div class="auth-sub">Ingresa con tu matrícula para continuar</div>
  {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="auth-field">
      <label>Matrícula</label>
      <input type="text" name="matricula" placeholder="172511XXXX" maxlength="10" autocomplete="off" autofocus required>
      <div class="auth-hint">Solo matrículas que empiecen con 172511</div>
    </div>
    <button type="submit" class="v-btn-primary">Entrar</button>
  </form>
  <div class="auth-link-row">
    ¿No tienes cuenta? <a href="{{ url_for('registro_view') }}">Regístrate aquí</a>
  </div>
</div>
</body>
</html>
